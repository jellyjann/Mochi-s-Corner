    <script>
      // Make window.fetch writable/reassignable to prevent "Cannot set property fetch of Window which has only a getter"
      try {
        let _fetch = window.fetch;
        if (_fetch) {
          Object.defineProperty(window, 'fetch', {
            get() { return _fetch; },
            set(v) { _fetch = v; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {}
    </script>
